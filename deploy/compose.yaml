# WorldSmith deployment. Profiles pick the machine's role:
#   hub    → Tailscale node "worldsmith" + hub app (portal, Claude connector)
#            + edge (gatekeeper + playit tunnel for friends)
#   (Phase 1 adds world containers under "worker")
#
#   cp deploy/.env.example deploy/.env    # then edit (secrets live only there)
#   docker compose -f deploy/compose.yaml --profile hub up -d --build
#
# Tailscale serve config (deploy/tailscale/serve.json):
#   https://worldsmith.<tailnet>.ts.net        → Funnel (public)  → hub public listener :3001
#   https://worldsmith.<tailnet>.ts.net:8443   → tailnet only     → hub portal listener :3000
#
# Network namespaces (security boundary):
#   ts   ⇄ hub          private: portal trusts Tailscale identity headers on loopback
#   gatekeeper ⇄ playit  edge: internet game traffic; can never reach the portal's loopback

name: worldsmith

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  ts:
    profiles: [hub]
    image: tailscale/tailscale:stable
    hostname: worldsmith
    environment:
      TS_HOSTNAME: worldsmith
      TS_STATE_DIR: /var/lib/tailscale
      # Kernel networking, not userspace: in userspace mode tailscaled forwards ANY inbound tailnet
      # connection to the matching 127.0.0.1 port, letting tailnet peers bypass `serve` and forge
      # the Tailscale identity headers the portal trusts. With a real tun device, loopback stays loopback.
      TS_USERSPACE: "false"
      TS_SERVE_CONFIG: /config/serve.json
      # No TS_AUTHKEY: first start prints a login link (docker compose logs ts) to approve
      # this node into your own tailnet. State persists in the ts-state volume.
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    volumes:
      - ts-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    restart: unless-stopped

  hub:
    <<: *hardening
    profiles: [hub]
    build:
      context: ..
      dockerfile: apps/hub/Dockerfile
    # Shares the ts container's network namespace: the hub's loopback listeners are reachable
    # only through tailscaled (serve/funnel), never from the LAN or other containers.
    network_mode: service:ts
    depends_on:
      ts:
        condition: service_started
        restart: true # sharing ts's network namespace: must restart whenever ts does
    # Only what the hub needs; secrets like PLAYIT_SECRET stay out of this container.
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set in deploy/.env}
      PORTAL_URL: ${PORTAL_URL:?set in deploy/.env}
      OWNER_LOGIN: ${OWNER_LOGIN:?set in deploy/.env}
      OWNER_NAME: ${OWNER_NAME:-the owner}
      OWNER_MC_USERNAME: ${OWNER_MC_USERNAME:-}
      WORKER_URL: ${WORKER_URL:-http://worker:7070}
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN in deploy/.env}
      GATE_SOCKET: /ipc/hub.sock
    volumes:
      - hub-data:/data
      - hub-ipc:/ipc # gate socket shared with the gatekeeper; no network path
    tmpfs: [/tmp]

  # ---- edge: the only internet-facing game traffic -------------------------------------------
  gatekeeper:
    <<: *hardening
    profiles: [hub]
    build:
      context: ..
      dockerfile: apps/gatekeeper/Dockerfile
    depends_on: [hub]
    environment:
      GK_PORT: "25565"
      GK_HUB_SOCKET: /ipc/hub.sock
    volumes:
      - hub-ipc:/ipc
    # worlds: to pipe players to world containers. No Docker socket, no secrets.
    networks: [default, worlds]
    ports:
      - "127.0.0.1:25565:25565" # local testing from this PC only; friends come in via playit

  playit:
    profiles: [hub]
    image: ghcr.io/playit-cloud/playit-agent:1.0.10
    # Same namespace as the gatekeeper, so a tunnel's default local address 127.0.0.1:25565
    # reaches it without host networking.
    network_mode: service:gatekeeper
    depends_on:
      gatekeeper:
        condition: service_started
        restart: true
    environment:
      SECRET_KEY: ${PLAYIT_SECRET:?set PLAYIT_SECRET in deploy/.env}
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # ---- worker: runs the world containers -------------------------------------------------------
  worker:
    profiles: [worker]
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN in deploy/.env}
      WORLDS_NETWORK: worldsmith_worlds
    volumes:
      # Root-equivalent: the worker's API is token-protected and published nowhere.
      - /var/run/docker.sock:/var/run/docker.sock
      - worker-cache:/cache
      - worker-backups:/backups # world backups (copy off this machine later: mini PC / USB / cloud)
    networks: [default, worlds]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  # World containers live here with no published ports; only the gatekeeper and worker can reach them.
  worlds:
    name: worldsmith_worlds

volumes:
  ts-state:
  hub-data:
  worker-cache:
  worker-backups:
  hub-ipc:
